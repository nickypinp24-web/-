<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บอกกุที - สุ่มอาหารตามสั่ง</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;900&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E8192C;
    --orange: #FF6B00;
    --yellow: #FFD000;
    --dark: #1A0A00;
    --cream: #FFF8EE;
    --brown: #5C2D00;
    --shadow: rgba(232,25,44,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Kanit', sans-serif;
    background: var(--dark);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(232,25,44,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(255,107,0,0.12) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(255,208,0,0.08) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .steam {
    position: fixed;
    bottom: -20px;
    width: 100%;
    height: 200px;
    background: linear-gradient(to top, rgba(255,107,0,0.06), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 700px;
    margin: 0 auto;
    padding: 30px 20px;
    text-align: center;
  }

  /* Header */
  .header {
    margin-bottom: 30px;
  }

  .header-badge {
    display: inline-block;
    background: var(--red);
    color: white;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    padding: 5px 16px;
    border-radius: 20px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  h1 {
    font-size: clamp(2.2rem, 8vw, 3.5rem);
    font-weight: 900;
    color: var(--cream);
    line-height: 1.05;
    text-shadow: 0 0 40px rgba(255,107,0,0.5);
  }

  h1 span {
    color: var(--orange);
    display: block;
  }

  .subtitle {
    color: rgba(255,248,238,0.55);
    font-size: 1rem;
    margin-top: 8px;
    font-family: 'Sarabun', sans-serif;
  }

  /* Card */
  .food-card {
    background: rgba(255,248,238,0.04);
    border: 1px solid rgba(255,248,238,0.08);
    border-radius: 24px;
    padding: 30px 24px;
    margin-bottom: 28px;
    min-height: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
    transition: border-color 0.3s;
  }

  .food-card.active {
    border-color: rgba(255,107,0,0.4);
    box-shadow: 0 0 60px rgba(232,25,44,0.15), inset 0 0 40px rgba(255,107,0,0.04);
  }

  .food-card::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px; right: -1px;
    height: 3px;
    background: linear-gradient(90deg, var(--red), var(--orange), var(--yellow));
    border-radius: 24px 24px 0 0;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .food-card.active::before { opacity: 1; }

  /* Empty state */
  .empty-state {
    opacity: 0.4;
  }

  .empty-icon {
    font-size: 4rem;
    margin-bottom: 16px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .empty-text {
    color: var(--cream);
    font-size: 1.1rem;
    font-weight: 600;
  }
  .empty-sub {
    color: rgba(255,248,238,0.5);
    font-size: 0.85rem;
    margin-top: 6px;
    font-family: 'Sarabun', sans-serif;
  }

  /* Food display */
  .food-result {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    animation: revealFood 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes revealFood {
    from { opacity: 0; transform: scale(0.85) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .food-emoji-box {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 4px solid var(--orange);
    box-shadow: 0 0 0 8px rgba(255,107,0,0.1), 0 20px 50px rgba(0,0,0,0.5);
    margin-bottom: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,107,0,0.08);
    gap: 8px;
    padding: 16px;
    text-align: center;
  }

  .food-emoji-box .big-emoji {
    font-size: 3rem;
    line-height: 1;
  }

  .food-emoji-box .taunt-text {
    font-family: 'Kanit', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--orange);
    line-height: 1.3;
  }

  .food-number {
    font-size: 0.75rem;
    color: var(--orange);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .food-name {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 900;
    color: var(--cream);
    text-shadow: 0 2px 20px rgba(255,107,0,0.4);
    margin-bottom: 8px;
    line-height: 1.2;
  }

  .food-desc {
    font-family: 'Sarabun', sans-serif;
    color: rgba(255,248,238,0.6);
    font-size: 0.9rem;
    max-width: 320px;
    line-height: 1.5;
  }

  .food-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 14px;
  }

  .tag {
    background: rgba(255,107,0,0.15);
    border: 1px solid rgba(255,107,0,0.3);
    color: var(--orange);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
  }

  /* Spin animation for card */
  @keyframes cardSpin {
    0% { transform: scale(1); }
    25% { transform: scale(0.95) rotate(-1deg); }
    50% { transform: scale(0.92); }
    75% { transform: scale(0.95) rotate(1deg); }
    100% { transform: scale(1); }
  }

  .food-card.spinning {
    animation: cardSpin 0.15s ease-in-out;
  }

  /* Button */
  .btn-wrap {
    position: relative;
    display: inline-block;
  }

  .btn-glow {
    position: absolute;
    inset: -8px;
    background: radial-gradient(ellipse, rgba(232,25,44,0.5) 0%, transparent 70%);
    border-radius: 50px;
    filter: blur(12px);
    animation: pulse 2s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  .btn-main {
    position: relative;
    background: linear-gradient(135deg, var(--red) 0%, var(--orange) 100%);
    color: white;
    border: none;
    padding: 20px 52px;
    font-family: 'Kanit', sans-serif;
    font-size: 1.5rem;
    font-weight: 900;
    border-radius: 60px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 8px 30px rgba(232,25,44,0.5), 0 2px 0 rgba(255,255,255,0.2) inset;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-main:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 40px rgba(232,25,44,0.6), 0 2px 0 rgba(255,255,255,0.2) inset;
  }

  .btn-main:active {
    transform: translateY(1px) scale(0.98);
    box-shadow: 0 4px 15px rgba(232,25,44,0.4);
  }

  .btn-main.loading {
    pointer-events: none;
    opacity: 0.85;
  }

  .btn-main .btn-icon {
    display: inline-block;
    margin-right: 8px;
    transition: transform 0.3s;
  }

  .btn-main:hover .btn-icon {
    transform: rotate(20deg) scale(1.2);
  }

  /* Counter */
  .counter-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 22px;
  }

  .counter-item {
    text-align: center;
  }

  .counter-num {
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--yellow);
    line-height: 1;
  }

  .counter-label {
    font-size: 0.72rem;
    color: rgba(255,248,238,0.45);
    font-family: 'Sarabun', sans-serif;
    letter-spacing: 0.05em;
  }

  .divider {
    width: 1px;
    height: 36px;
    background: rgba(255,248,238,0.1);
  }

  /* Slots animation */
  .slot-container {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 100%;
    padding: 20px 0;
  }

  .slot-item {
    font-size: 1.1rem;
    font-weight: 700;
    color: rgba(255,248,238,0.25);
    transition: all 0.1s;
    line-height: 1.6;
  }

  .slot-item.highlight {
    color: var(--cream);
    font-size: 1.5rem;
    color: var(--orange);
    text-shadow: 0 0 20px rgba(255,107,0,0.8);
  }

  /* History */
  .history-section {
    margin-top: 24px;
    text-align: left;
  }

  .history-title {
    color: rgba(255,248,238,0.4);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 4px;
  }

  .history-list {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .history-chip {
    background: rgba(255,248,238,0.05);
    border: 1px solid rgba(255,248,238,0.1);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 0.8rem;
    color: rgba(255,248,238,0.5);
    font-family: 'Sarabun', sans-serif;
    transition: all 0.2s;
  }

  .history-chip:hover {
    background: rgba(255,107,0,0.1);
    border-color: rgba(255,107,0,0.3);
    color: var(--orange);
  }

  /* Firework */
  @keyframes firework {
    0% { opacity: 1; transform: scale(0); }
    100% { opacity: 0; transform: scale(4); }
  }

  .spark {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    pointer-events: none;
    animation: firework 0.6s ease-out forwards;
  }

  /* Footer */
  .footer {
    margin-top: 36px;
    color: rgba(255,248,238,0.2);
    font-size: 0.75rem;
    font-family: 'Sarabun', sans-serif;
  }

  @media (max-width: 480px) {
    .container { padding: 20px 16px; }
    .btn-main { padding: 18px 40px; font-size: 1.3rem; }
    .food-image-wrapper { width: 160px; height: 160px; }
  }
</style>
</head>
<body>
<div class="steam"></div>

<div class="container">
  <div class="header">
    <div class="header-badge">🍳 อาหารตามสั่ง</div>
    <h1>วันนี้กิน<span>อะไรดี?</span></h1>
    <p class="subtitle">กด "บอกกุที" แล้วกูจะบอกเอง</p>
  </div>

  <div class="food-card" id="foodCard">
    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <span class="empty-icon">🍽️</span>
      <div class="empty-text">ยังไม่ได้สุ่มอะไรเลย</div>
      <div class="empty-sub">กดปุ่มด้านล่างเลย!</div>
    </div>

    <!-- Slot machine -->
    <div class="slot-container" id="slotContainer">
      <div class="slot-item" id="slot1"></div>
      <div class="slot-item highlight" id="slot2"></div>
      <div class="slot-item" id="slot3"></div>
    </div>

    <!-- Food result -->
    <div class="food-result" id="foodResult">
      <div class="food-emoji-box">
        <div class="big-emoji" id="foodEmoji">🍽️</div>
        <div class="taunt-text">แดกสะไอสัดกุคิดให้มึงละ</div>
      </div>
      <div class="food-number" id="foodNumber"></div>
      <div class="food-name" id="foodName"></div>
      <div class="food-desc" id="foodDesc"></div>
      <div class="food-tags" id="foodTags"></div>
    </div>
  </div>

  <div class="btn-wrap">
    <div class="btn-glow"></div>
    <button class="btn-main" id="spinBtn" onclick="spinFood()">
      <span class="btn-icon">🎲</span>บอกกุที
    </button>
  </div>

  <div class="counter-bar">
    <div class="counter-item">
      <div class="counter-num" id="spinCount">0</div>
      <div class="counter-label">ครั้งที่กด</div>
    </div>
    <div class="divider"></div>
    <div class="counter-item">
      <div class="counter-num">30</div>
      <div class="counter-label">เมนูทั้งหมด</div>
    </div>
    <div class="divider"></div>
    <div class="counter-item">
      <div class="counter-num" id="uniqueCount">0</div>
      <div class="counter-label">เมนูที่เจอ</div>
    </div>
  </div>

  <div class="history-section" id="historySection" style="display:none">
    <div class="history-title">ประวัติการสุ่ม</div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="footer">มีทั้งหมด 30 เมนูยอดนิยม • ลองสุ่มดูเลย!</div>
</div>

let spinCount = 0;
let history = [];
let uniqueSet = new Set();
let isSpinning = false;
let currentIdx = -1;

function spinFood() {
  if (isSpinning) return;
  isSpinning = true;

  const btn = document.getElementById('spinBtn');
  btn.classList.add('loading');
  btn.innerHTML = '<span class="btn-icon">⏳</span>กำลังสุ่ม...';

  const card = document.getElementById('foodCard');
  const emptyState = document.getElementById('emptyState');
  const foodResult = document.getElementById('foodResult');
  const slotContainer = document.getElementById('slotContainer');

  emptyState.style.display = 'none';
  foodResult.style.display = 'none';
  slotContainer.style.display = 'flex';
  card.classList.add('active');

  // Slot machine effect
  let ticks = 0;
  const maxTicks = 18;
  const interval = setInterval(() => {
    ticks++;
    const speed = ticks < maxTicks * 0.6 ? 60 : ticks < maxTicks * 0.85 ? 120 : 200;
    
    const r1 = Math.floor(Math.random() * foods.length);
    const r2 = Math.floor(Math.random() * foods.length);
    const r3 = Math.floor(Math.random() * foods.length);
    document.getElementById('slot1').textContent = foods[r1].name;
    document.getElementById('slot2').textContent = foods[r2].name;
    document.getElementById('slot3').textContent = foods[r3].name;

    if (ticks >= maxTicks) {
      clearInterval(interval);
      let newIdx;
      do { newIdx = Math.floor(Math.random() * foods.length); }
      while (newIdx === currentIdx && foods.length > 1);
      currentIdx = newIdx;
      showFood(foods[currentIdx]);
    }
  }, 80);
}

function showFood(food) {
  spinCount++;
  uniqueSet.add(food.name);
  history.unshift(food.name);
  if (history.length > 8) history.pop();

  document.getElementById('spinCount').textContent = spinCount;
  document.getElementById('uniqueCount').textContent = uniqueSet.size;

  const slotContainer = document.getElementById('slotContainer');
  const foodResult = document.getElementById('foodResult');

  slotContainer.style.display = 'none';

  // Set content
  const img = document.getElementById('foodEmoji');
  img.textContent = food.emoji;
  document.getElementById('foodNumber').textContent = `เมนูที่ ${spinCount} 🎯`;
  document.getElementById('foodName').textContent = food.name;
  document.getElementById('foodDesc').textContent = food.desc;

  const tagsEl = document.getElementById('foodTags');
  tagsEl.innerHTML = food.tags.map(t => `<span class="tag">${t}</span>`).join('');

  foodResult.style.display = 'flex';
  foodResult.style.animation = 'none';
  setTimeout(() => { foodResult.style.animation = 'revealFood 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards'; }, 10);

  // Sparks
  createSparks();

  // History
  updateHistory();

  // Reset button
  const btn = document.getElementById('spinBtn');
  btn.classList.remove('loading');
  btn.innerHTML = '<span class="btn-icon">🎲</span>บอกกุที';
  isSpinning = false;

  const card = document.getElementById('foodCard');
  card.classList.add('spinning');
  setTimeout(() => card.classList.remove('spinning'), 300);
}

function createSparks() {
  const card = document.getElementById('foodCard');
  const colors = ['#E8192C','#FF6B00','#FFD000','#FF3366','#FF8800'];
  for (let i = 0; i < 12; i++) {
    const spark = document.createElement('div');
    spark.className = 'spark';
    spark.style.cssText = `
      left: ${20 + Math.random() * 60}%;
      top: ${20 + Math.random() * 60}%;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      animation-delay: ${Math.random() * 0.3}s;
    `;
    card.appendChild(spark);
    setTimeout(() => spark.remove(), 900);
  }
}

function updateHistory() {
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  section.style.display = 'block';
  list.innerHTML = history.map(name => `<div class="history-chip">${name}</div>`).join('');
}
